<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Amna 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body
  <button id="btn">🎵 Play Birthday Music</button>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById("btn");
const music = document.getElementById("music");

btn.addEventListener("click", function () {
  music.play()
    .then(() => {
      console.log("Music playing");
    })
    .catch(err => {
      alert("Play nahi ho raha: " + err);
    });
});
</script>
<!-- INTRO -->
<div id="intro">
  <h1 id="typing"></h1>
</div>

<!-- MAIN -->
<div id="main" class="hidden">

  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3 " type="audio/mpeg">
  </audio>

  <div class="container">
    <h1 class="hbd">HBD 🎂</h1>
    <h2 class="name">Amna 💖</h2>
    <h3 class="date">20 April 🎉</h3>

    <p class="wish">
      Wishing you endless happiness, success, !  
      May your day be filled with joy and magic ✨💖
    </p>

    dev by : Taha
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
